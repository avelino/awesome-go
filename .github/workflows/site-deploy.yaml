name: site-deploy

on:
  push:
    branches:
      - "main"

permissions:
  contents: read #  to fetch code (actions/checkout)

jobs:
  build:
    name: Make and Deploy site
    runs-on: ubuntu-latest
    environment: netlify
    container: golang:1.27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get dependencies
        run: go mod download
      - name: Restore GitHub metadata cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/repos
          key: repo-meta-${{ github.run_id }}
          restore-keys: repo-meta-
      - name: Make awesome-go.com
        run: go run .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: deploy awesome-go.com
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0.0
        with:
          publish-dir: "./out"
          production-branch: main
          production-deploy: true
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-commit-status: false
          overwrites-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10
